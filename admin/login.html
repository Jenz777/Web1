<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Đăng nhập quản trị | TTL Shop Admin</title>
<link rel="stylesheet" href="../assets/fonts/fonts.css">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body class="adm adm-auth">
<main class="adm-login">
<div class="adm-login-brand"><span class="logo-mark"><img src="../assets/images/logo-icon.png" alt="TTL Shop"></span><span>TTL Shop<small>Quản trị hệ thống</small></span></div>
<section class="adm-card" aria-labelledby="t"><nav class="login-switch" aria-label="Chọn loại tài khoản"><a href="../pages/auth/login.html">Khách hàng</a><a class="on" href="login.html" aria-current="page">Quản trị viên</a></nav><h2 id="t">Đăng nhập quản trị</h2><p class="adm-sub">Mỗi quản trị viên có một tài khoản riêng.</p>
<form novalidate class="adm-form" action="login-thanh-cong.html" method="post">
<div class="fld"><label for="e">Email quản trị</label><input id="e" name="email" type="email" placeholder="admin@ttlshop.vn" autocomplete="username"></div>
<div class="fld"><label for="p">Mật khẩu</label><input id="p" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password"></div>
<button class="btn btn-pri full" type="submit">Đăng nhập</button></form></section>
<p class="adm-foot">© 2026 TTL Shop · Khu vực quản trị</p>
</main>
</body>
</html>
